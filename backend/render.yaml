services:
  - type: web
    name: le-libros-caribe-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: le-libros-caribe-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: STRIPE_SECRET_KEY
        value: ""
      - key: AMAZON_AFFILIATE_TAG
        value: lecaribe-20
